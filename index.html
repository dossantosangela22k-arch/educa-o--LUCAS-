
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aventuras do Lucas 🚀 - Aprenda a Ler!</title>
  <style>
    * { box-sizing: border-box; font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif; margin: 0; padding: 0; }
    body { background-color: #FFEB3B; text-align: center; padding: 20px; }
    
    .container {
      max-width: 650px;
      margin: 0 auto;
      background: #FFFFFF;
      border-radius: 25px;
      padding: 25px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
      border: 6px solid #4CAF50;
    }

    h1 { color: #E91E63; font-size: 2.2rem; margin-bottom: 10px; }
    .subtitle { color: #3F51B5; font-size: 1.2rem; font-weight: bold; margin-bottom: 20px; }

    .story-card {
      background: #E0F7FA;
      border-radius: 20px;
      padding: 20px;
      border: 4px dashed #00BCD4;
      margin-bottom: 20px;
    }

    .emoji-scene { font-size: 4rem; margin-bottom: 10px; }
    .story-text { font-size: 1.8rem; color: #212121; margin-bottom: 15px; font-weight: bold; }
    
    .word-highlight {
      color: #E91E63;
      background: #FFF9C4;
      padding: 2px 8px;
      border-radius: 8px;
      border: 2px solid #FF9800;
    }

    .btn-audio {
      background: #9C27B0;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 1.1rem;
      border-radius: 50px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 4px #7B1FA2;
      transition: 0.1s;
    }
    .btn-audio:active { transform: translateY(4px); box-shadow: none; }

    .options-title { font-size: 1.3rem; color: #FF5722; margin: 15px 0 10px; font-weight: bold; }
    
    .options-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }

    .btn-option {
      background: #4CAF50;
      color: white;
      border: none;
      padding: 15px;
      font-size: 1.6rem;
      font-weight: bold;
      border-radius: 15px;
      cursor: pointer;
      box-shadow: 0 5px #388E3C;
      transition: 0.1s;
    }
    .btn-option:nth-child(2) { background: #FF9800; box-shadow: 0 5px #F57C00; }
    .btn-option:nth-child(3) { background: #2196F3; box-shadow: 0 5px #1976D2; }
    .btn-option:nth-child(4) { background: #E91E63; box-shadow: 0 5px #C2185B; }
    
    .btn-option:active { transform: translateY(5px); box-shadow: none; }

    .feedback {
      font-size: 1.5rem;
      font-weight: bold;
      height: 40px;
      margin-bottom: 10px;
    }

    .progress-bar {
      width: 100%;
      background: #E0E0E0;
      height: 20px;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 15px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: #4CAF50;
      transition: width 0.3s;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🚀 Aventura de Ler do Lucas!</h1>
    <div class="subtitle" id="level-title">Fase 1: As Vogais Mágicas</div>

    <div class="story-card">
      <div class="emoji-scene" id="emoji">🐶</div>
      <div class="story-text" id="story">O <span class="word-highlight" id="target-word">LUCAS</span> viu o cachorro.</div>
      <button class="btn-audio" onclick="playAudio()">🔊 Ouvir a História</button>
    </div>

    <div class="options-title">Clique na palavra correta para avançar:</div>
    <div class="options-grid" id="options-container">
      <!-- Botões gerados via JS -->
    </div>

    <div class="feedback" id="feedback"></div>

    <div class="progress-bar">
      <div class="progress-fill" id="progress"></div>
    </div>
  </div>

  <script>
    const levels = [
      { emoji: "🐶", text: "O cachorro do Lucas faz", word: "AU", options: ["AU", "EI", "OU", "IA"], title: "Fase 1: Encontros de Vogais" },
      { emoji: "🐱", text: "O gatinho da historinha diz", word: "MIAU", options: ["MIAU", "AU", "OI", "EI"], title: "Fase 1: Vogais Divertidas" },
      { emoji: "BOLA", emojiIcon: "⚽", text: "Lucas joga com a sua", word: "BOLA", options: ["BOLA", "BONE", "BOLO", "BALA"], title: "Fase 2: Sílabas Simples (B)" },
      { emoji: "🏠", text: "Lucas entrou na sua", word: "CASA", options: ["CASA", "COPO", "CAVO", "CAMA"], title: "Fase 2: Sílabas Simples (C)" },
      { emoji: "☀️", text: "No céu brilha o grande", word: "SOL", options: ["SOL", "SAPO", "SUCO", "SOFA"], title: "Fase 3: Palavras Curtas" },
      { emoji: "🦁", text: "O rei da floresta é o", word: "LEÃO", options: ["LEÃO", "LIMA", "LUA", "LAGO"], title: "Fase 3: Desafio Final!" }
    ];

    let currentLevel = 0;

    function loadLevel() {
      const lvl = levels[currentLevel];
      document.getElementById("level-title").innerText = lvl.title;
      document.getElementById("emoji").innerText = lvl.emojiIcon || lvl.emoji;
      document.getElementById("story").innerHTML = lvl.text + ` <span class="word-highlight">${lvl.word}</span>`;
      document.getElementById("feedback").innerText = "";
      
      const optionsContainer = document.getElementById("options-container");
      optionsContainer.innerHTML = "";

      // Embaralhar opções
      let shuffled = [...lvl.options].sort(() => Math.random() - 0.5);

      shuffled.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "btn-option";
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(opt, lvl.word);
        optionsContainer.appendChild(btn);
      });

      updateProgress();
    }

    function checkAnswer(selected, correct) {
      const feedback = document.getElementById("feedback");
      if (selected === correct) {
        feedback.style.color = "#4CAF50";
        feedback.innerText = "🌟 PARABÉNS, LUCAS! VOCÊ ACERTOU!";
        speakText("Muito bem, Lucas! " + selected);
        setTimeout(() => {
          currentLevel++;
          if (currentLevel < levels.length) {
            loadLevel();
          } else {
            showWinScreen();
          }
        }, 1500);
      } else {
        feedback.style.color = "#F44336";
        feedback.innerText = "❌ Tente de novo, Lucas!";
        speakText("Tente de novo!");
      }
    }

    function playAudio() {
      const lvl = levels[currentLevel];
      speakText(`${lvl.text} ${lvl.word}`);
    }

    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'pt-BR';
        utterance.rate = 0.8; // Voz mais pausada para crianças
        utterance.pitch = 1.2;
      }
    }

    function updateProgress() {
      const percentage = (currentLevel / levels.length) * 100;
      document.getElementById("progress").style.width = percentage + "%";
    }

    function showWinScreen() {
      document.querySelector(".container").innerHTML = `
        <h1 style="font-size: 3rem;">🏆 VOCÊ VENCEU!</h1>
        <div style="font-size: 5rem; margin: 20px 0;">🎉🎯👑</div>
        <p style="font-size: 1.5rem; color: #3F51B5; font-weight: bold;">
          Parabéns, Lucas! Você já aprendeu a ler suas primeiras palavras!
        </p>
        <button class="btn-audio" style="margin-top: 20px;" onclick="location.reload()">Jogar Novamente 🔄</button>
      `;
      speakText("Parabéns, Lucas! Você venceu e aprendeu a ler!");
    }

    // Inicializar o jogo
    loadLevel();
  </script>
</body>
</html>
